<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MailStudio</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#233047;background:#f4f6fb;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #dce2ef;background:white;color:#35435b;padding:10px 15px;border-radius:9px}button:hover{background:#f0ecff}button:disabled{opacity:.5;cursor:wait}.primary{background:#7553eb;color:white;border-color:#7553eb}.danger{color:#bd3b51}input,select,textarea{padding:11px;border:1px solid #dce2ef;background:#fff;border-radius:8px;max-width:100%;width:100%;color:inherit}textarea{resize:vertical;min-height:120px}label{display:block;margin:13px 0 6px;color:#5c6a82;font-size:13px}a{color:#7553eb}aside{position:fixed;inset:0 auto 0 0;width:230px;background:#14243b;color:#becbdf;padding:30px 20px;display:flex;flex-direction:column}.brand{color:white;font-size:24px;font-weight:700;letter-spacing:-1px;margin-bottom:42px}.brand span{display:inline-grid;place-items:center;background:#7553eb;border-radius:10px;width:35px;height:35px;font-size:20px;margin-right:8px}.nav{display:grid;gap:8px}.nav button{background:none;color:#becbdf;border:0;text-align:left}.nav button.active{background:#2b3559;color:white}.asidefoot{margin-top:auto;font-size:12px;line-height:1.9;color:#879ab6}.layout{margin-left:230px}header{background:#fff;border-bottom:1px solid #e4e9f3;padding:20px 35px;display:flex;align-items:center;justify-content:space-between;gap:20px}header select{width:auto;max-width:380px}main{padding:35px;max-width:1450px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}h1{font-size:29px;letter-spacing:-.8px;margin:0 0 8px}h2{font-size:17px}p{color:#758198;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:25px 0}.card,.panel{background:white;border:1px solid #e5e9f2;border-radius:15px;padding:24px}.card strong{display:block;font-size:33px;margin:14px 0 7px}.card small,.muted{color:#8190a7}.banner{background:#eae4fd;border-radius:14px;padding:24px;margin:20px 0;display:flex;justify-content:space-between;align-items:center;gap:20px}.banner p{color:#665784;margin:5px 0}.panel{margin:18px 0;overflow:auto}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{text-align:left;padding:15px 10px;border-bottom:1px solid #edf0f6}th{color:#8491a7;font-weight:500;font-size:12px}td small{display:block;color:#8a95a8;max-width:250px;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.badge{padding:5px 9px;background:#f0ebff;color:#7855d7;border-radius:6px;font-size:12px}.badge.sent,.badge.replied,.badge.done{background:#e4f4ed;color:#318368}.badge.pending,.badge.blocked{background:#fff0e1;color:#a97329}.empty{text-align:center;padding:55px 20px;color:#8895ac}.empty h2{color:#45566f}dialog{border:0;border-radius:16px;padding:28px;width:650px;max-width:95vw;max-height:90vh;box-shadow:0 24px 90px #11243b50}dialog::backdrop{background:#11243b66}.dialoghead{display:flex;justify-content:space-between;align-items:center}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:15px}.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.hint{background:#f4f6fc;padding:14px;border-radius:10px;color:#748198;font-size:13px;line-height:1.7;margin:16px 0}.error{color:#bd3b51;white-space:pre-wrap;font-size:13px}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:15px 23px;border-radius:10px;background:#20314d;color:white;display:none;z-index:100;max-width:90vw}.message{padding:16px;border-radius:12px;background:#f4f6fc;margin:12px 0;white-space:pre-wrap;line-height:1.7}.message.out{background:#f0ebfe}.onboard{max-width:650px;margin:10vh auto;padding:45px;background:white;border:1px solid #e4e9f3;border-radius:20px}.onboard .brand{color:#233047;margin-bottom:30px}.steps{display:flex;gap:16px;margin:23px 0}.steps b{color:#7553eb;font-size:20px}.steps p{margin:0}.tabs{display:flex;gap:8px;margin-top:20px}.bodypreview{white-space:pre-wrap;line-height:1.8}#busy{font-size:12px;color:#7553eb}
@media(max-width:900px){aside{position:static;width:auto;padding:20px}.brand{margin-bottom:15px}.nav{grid-template-columns:repeat(4,1fr);gap:3px}.nav button{font-size:12px;padding:9px}.asidefoot{display:none}.layout{margin-left:0}main{padding:20px}header{padding:15px}.cards{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.pagehead,.banner{align-items:flex-start;flex-direction:column}.formrow{grid-template-columns:1fr}h1{font-size:25px}}
</style></head><body><div id="app"><div class="onboard">正在连接 Google 工作台…</div></div><dialog id="modal"></dialog><div id="toast" role="status"></div><script>
'use strict';
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S,D,chosen='',page='overview',batch='',search='',currentContact='',busy=0;
const pages={overview:'工作概览',accounts:'邮箱管理',contacts:'客户与批次',templates:'邮件模板',tasks:'发送任务',inbox:'回复会话',history:'发送记录',settings:'设置与备份'};
const labels={queued:'待发送',sent:'已发送',replied:'已回复',paused:'已暂停',running:'运行中',cancelled:'已取消',done:'已完成',pending:'待核对',active:'正常',blocked:'禁止发送',first:'首封',follow1:'第一次回访',follow2:'第二次回访',manual:'手动回复'};
function call(action,p={}){busy++;const indicator=$('#busy');if(indicator)indicator.textContent='正在处理…';return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||String(e)))).api(action,{email:chosen,...p})).finally(()=>{busy--;if($('#busy'))$('#busy').textContent=busy?'正在处理…':'';});}
const B=(act,label,cls='',data='')=>`<button class="${cls}" data-act="${act}" ${data}>${label}</button>`;
const badge=s=>`<span class="badge ${E(s)}">${E(labels[s]||s)}</span>`;
const F=(name,label,value='',type='text',extra='')=>`<div><label>${label}</label><input name="${name}" type="${type}" value="${E(value)}" ${extra}></div>`;
const A=(name,label,value='')=>`<label>${label}</label><textarea name="${name}">${E(value)}</textarea>`;
const fmt=n=>n?new Date(n).toLocaleString('zh-CN',{hour12:false}):'—';
const T=(heads,rows)=>rows.length?`<table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`:'<div class="empty"><h2>这里还没有数据</h2><p>准备好后，从上方操作开始。</p></div>';
const head=(title,desc,actions='')=>`<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`;
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',7000);}
function modal(title,html,onSubmit,label='保存'){const d=$('#modal');d.innerHTML=`<div class="dialoghead"><h2>${title}</h2>${B('close','✕')}</div>${onSubmit?'<form id="form">':''}${html}${onSubmit?`<div class="error" id="err"></div><div class="foot">${B('close','取消')}<button type="submit" class="primary">${label}</button></div></form>`:''}`;if(!d.open)d.showModal();if(onSubmit)$('#form').onsubmit=async e=>{e.preventDefault();const submit=e.target.querySelector('[type=submit]');submit.disabled=true;try{await onSubmit(new FormData(e.target));d.close();}catch(e){$('#err').textContent=e.message;}finally{submit.disabled=false;}};}
async function boot(){try{S=await call('snapshot');if(!S.accounts.some(a=>a.email===S.me&&a.config))return onboard();chosen=chosen||S.me;await refresh();}catch(e){$('#app').innerHTML=`<div class="onboard"><h1>需要 Google 授权</h1><p class="error">${E(e.message)}</p>${B('boot','重新连接','primary')}</div>`;}}
function onboard(){$('#app').innerHTML=`<section class="onboard"><div class="brand"><span>✉</span>MailStudio</div><h1>连接你的邮件工作台</h1><p>当前 Google 账号：${E(S.me)}</p><div class="steps"><b>01</b><p>授权 Gmail 收信和发信，无需应用专用密码。</p></div><div class="steps"><b>02</b><p>创建用于保存客户、模板与任务的 Google 表格。${S.admin?'':'此表格会共享给工作台管理员，用于统一管理。'}</p></div><div class="steps"><b>03</b><p>导入客户，设置邮箱日程，再明确启动任务。</p></div><div class="hint">连接后默认关闭发送。Google 免费账号的服务配额仍然有效，工作台不会绕过配额。</div>${B('enroll','连接当前 Gmail','primary')}</section>`;}
async function refresh(){S=await call('snapshot');D=await call('data');shell();render();}
function shell(){$('#app').innerHTML=`<aside><div class="brand"><span>✉</span>MailStudio</div><nav class="nav">${Object.entries(pages).map(([k,v])=>B('nav',v,k===page?'active':'',`data-page="${k}"`)).join('')}</nav><div class="asidefoot">● Google 云端保存<br>MailStudio / Google Web<br>免费配额内使用</div></aside><div class="layout"><header><div>工作空间 / ${pages[page]} <span id="busy"></span></div><div class="actions"><select id="accountSelect">${S.accounts.filter(a=>a.config).map(a=>`<option ${a.email===chosen?'selected':''}>${E(a.email)}</option>`).join('')}</select>${B('refresh','刷新')}</div></header><main id="content"></main></div>`;$('#accountSelect').onchange=async e=>{chosen=e.target.value;await refresh();};}
function render(){const c=D.config,cs=D.contacts,ts=D.tasks,os=D.outgoing;let h='';
if(page==='overview'){const u=S.accounts.find(a=>a.email===chosen)?.usage||{},pending=os.filter(o=>o.state==='pending').length;h=head('每一次沟通，都井然有序。','管理邮箱、准备内容，按你的节奏发送。',B('newtask','＋ 创建任务','primary'))+`<div class="cards">${[['已连接邮箱',S.accounts.filter(a=>a.config).length,'每个邮箱独立授权'],['今日发送',u.total||0,'含待核对记录'],['收到回复',cs.filter(c=>c.status==='replied').length,'自动停止后续回访'],['待发送客户',cs.filter(c=>c.status==='queued').length,'任务默认暂停']].map(([t,n,s])=>`<div class="card">${t}<strong>${n}</strong><small>${s}</small></div>`).join('')}</div><div class="banner"><div><h2>${pending?'有发送结果需要核对':'发送节奏，由你设置'}</h2><p>${pending?'此邮箱已暂停继续发送，核对 Gmail 已发送记录后再继续。':'每个邮箱独立设置额度、间隔、时区和发送时段。'}</p></div>${B(pending?'reconcile':'schedule',pending?'核对发送结果':'设置邮箱日程')}</div><div class="split"><section class="panel"><h2>最近任务</h2>${T(['任务','批次','状态'],ts.slice(-5).reverse().map(t=>`<tr><td>${E(t.name)}</td><td>${E(t.batch)}</td><td>${badge(t.state)}</td></tr>`))}</section><section class="panel"><h2>后台运行</h2><p>当前账号的定时触发器：${S.trigger?'已安装':'未安装'}</p><p>邮箱发送：${c.enabled?'允许':'关闭'} · 日程：${c.schedule_ready?'已设置':'待确认'}</p><p>Google 剩余收件人配额：${S.me===chosen?(S.quota??'由 Google 核定'):'请切换到此 Google 账号查看'}</p>${B('trigger',S.trigger?'重新确认定时任务':'启用后台定时任务')}<div class="hint">后台任务由各邮箱自己的 Google 授权运行。Google 触发器可能延迟，不会提前突破你设定的间隔。</div></section></div>`;}
if(page==='accounts'){h=head('邮箱管理','在同一个工作台管理多个已授权 Gmail。',S.admin?B('invite','＋ 邀请邮箱','primary'):'')+`<section class="panel">${T(['邮箱','分组','授权与日程','今日用量','操作'],S.accounts.map(a=>`<tr><td>${E(a.email)}${a.email===S.me?'<small>当前 Google 授权账号</small>':''}</td><td>${E(a.config?.group||'—')}</td><td>${a.invited?badge('等待授权'):a.error?E(a.error):`${badge(a.config.enabled?'active':'paused')}<small>${E(a.config.zone)} ${E(a.config.window_start)}–${E(a.config.window_end)}</small>`}</td><td>${a.usage?.total??'—'} / ${a.config?.total_cap??'—'}</td><td>${a.config?B('switch','打开工作区','',`data-email="${E(a.email)}"`):''}</td></tr>`))}</section><div class="hint">其他邮箱打开同一网页并以自己的 Google 账号授权。各邮箱数据表向管理员共享；管理员统一设置任务，后台使用各邮箱自己的授权发送。手动回复和即时收信也需切换到对应 Google 账号。应用专用密码批量导入不适用于此方案。</div>${B('schedule','设置当前邮箱日程')}`;}
if(page==='contacts'){const filtered=cs.filter(c=>(!batch||c.batch===batch)&&(!search||(c.email+' '+c.first_name).toLowerCase().includes(search.toLowerCase()))).slice(0,500);h=head('客户与批次','按批次导入客户，查看发送与回复状态。',B('apply','应用当前模板')+B('import','＋ 导入客户','primary'))+`<section class="panel"><div class="actions"><select id="batchFilter" style="width:220px"><option value="">全部批次</option>${[...new Set(cs.map(c=>c.batch))].map(b=>`<option ${b===batch?'selected':''}>${E(b)}</option>`).join('')}</select><input id="search" style="width:260px" value="${E(search)}" placeholder="搜索邮箱或姓名">${B('search','搜索')}</div>${T(['客户','批次','状态','主题','操作'],filtered.map(c=>`<tr><td>${E(c.email)}<small>${E(c.first_name)} · ${E(c.location)}</small></td><td>${E(c.batch)}</td><td>${badge(c.status)} ${c.control!=='active'?badge(c.control):''}</td><td>${E(c.subject.slice(0,50))}</td><td>${B('editContact','编辑','',`data-id="${c.id}"`)}</td></tr>`))}<p>共 ${cs.length} 位联系人 · 当前显示最多 500 位，使用搜索缩小范围。</p></section>`;}
if(page==='templates'){const t=c.template;h=head('邮件模板','首次发送时锁定回访内容；收到正常回复后停止回访。')+`<form id="templateForm"><section class="panel"><h2>首封邮件</h2>${F('subject','主题',t.subject)}${A('body','正文',t.body)}<div class="hint">支持 {{first_name}} 与 {{location}}。保存模板后，在客户页面应用到尚未发送的批次。</div></section><div class="split"><section class="panel"><h2>第一次回访</h2>${F('follow1_days','距离首封天数',t.follow1_days,'number','min="1" required')}${A('follow1','正文（留空关闭）',t.follow1)}</section><section class="panel"><h2>第二次回访</h2>${F('follow2_days','距离第一次回访天数',t.follow2_days,'number','min="1" required')}${A('follow2','正文（留空关闭）',t.follow2)}</section></div><button class="primary" type="submit">保存模板</button></form>`;}
if(page==='tasks'){h=head('发送任务','任务保存在 Google 云端，启动后按邮箱日程运行。',B('newtask','＋ 创建任务','primary'))+`<section class="panel">${T(['任务','批次','创建时间','状态','操作'],ts.slice().reverse().map(t=>`<tr><td>${E(t.name)}</td><td>${E(t.batch)}</td><td>${fmt(t.created)}</td><td>${badge(t.state)}</td><td><div class="actions">${t.state==='paused'?B('taskstate','启动','primary',`data-id="${t.id}" data-state="running"`):t.state==='running'?B('taskstate','暂停','',`data-id="${t.id}" data-state="paused"`):''}${['running','paused'].includes(t.state)?B('taskstate','取消','danger',`data-id="${t.id}" data-state="cancelled"`):''}</div></td></tr>`))}</section><div class="hint">每个 Gmail 账号需安装自己的后台触发器。创建和导入操作不会自动发信；首次运行前，先设置日程并明确启动任务。</div>`;}
if(page==='inbox'){const visible=cs.filter(c=>c.threadId);h=head('回复会话','使用原发件邮箱，在原邮件线程中继续沟通。',B('sync','同步当前邮箱'))+`<section class="panel">${T(['客户','主题','状态','最后发送','操作'],visible.map(c=>`<tr><td>${E(c.email)}</td><td>${E(c.subject.slice(0,65))}</td><td>${badge(c.status)}</td><td>${fmt(c.last_sent)}</td><td>${B('conversation','打开会话','',`data-id="${c.id}"`)}</td></tr>`))}</section><div class="hint">每次同步处理最多 20 个会话，之后从断点继续。正文以纯文本显示，不加载邮件中的外部追踪内容。</div>`;}
if(page==='history'){h=head('发送记录','已发送和结果待确认记录均保留。',B('reconcile','核对待确认结果')+B('resume','解除本地暂停'))+`<section class="panel">${T(['收件人','类型','时间','状态','详情'],os.map(o=>`<tr><td>${E(o.to)}<small>${E(o.subject?.slice(0,65))}</small></td><td>${badge(o.kind)}</td><td>${fmt(o.sent_at||o.created)}</td><td>${badge(o.state)}</td><td>${E(o.detail||'')}</td></tr>`))}</section><div class="hint">只自动确认能在 Gmail 已发送中找到的记录。找不到的记录保持待核对，不会自动重发。</div>`;}
if(page==='settings'){h=head('设置与备份','数据保存在你的 Google 表格中。')+`<section class="panel"><h2>后台任务</h2><p>${E(S.me)} · ${S.trigger?'当前 Google 账号已安装触发器':'尚未安装触发器'}</p><div class="actions">${B('trigger','启用后台定时任务','primary')}${B('stopTrigger','停止我的后台定时任务')}</div></section><section class="panel"><h2>业务数据</h2><p>备份包括客户、模板、任务、发送记录和缓存会话，不包含 Google 密码或授权令牌。</p><div class="actions">${B('backup','下载 JSON 备份')}${B('restore','恢复空工作区')}</div><div class="hint">恢复后任务暂停、自动发送关闭。此版本支持自身 JSON 备份；原桌面 SQLite 尚未迁移。附件可随手动回复发送，原版批量投递检测尚未迁移。</div></section><section class="panel"><h2>Google 配额</h2><p>当前账号剩余收件人配额：${S.quota??'由 Google 核定'}。配额耗尽或授权异常时停止发送。</p><p>不需要绑定信用卡，不需要开通付费服务器。</p></section>`;}
$('#content').innerHTML=h;if($('#batchFilter'))$('#batchFilter').onchange=e=>{batch=e.target.value;render();};if($('#templateForm'))$('#templateForm').onsubmit=async e=>{e.preventDefault();try{await call('template',{template:Object.fromEntries(new FormData(e.target))});toast('模板已保存');await refresh();}catch(e){toast(e.message);}};
}
function schedule(){const c=D.config;modal('邮箱日程 · '+E(chosen),`<div class="formrow">${F('name','发件人名称',c.name)}${F('group','分组',c.group)}${['total_cap','first_cap','follow_cap','manual_cap'].map((k,i)=>F(k,['每日总额度','首封额度','回访额度','手动回复额度'][i],c[k],'number','min="1" required')).join('')}${F('window_start','开始时间',c.window_start,'time','required')}${F('window_end','结束时间',c.window_end,'time','required')}${F('min_minutes','最短间隔（分钟）',c.min_minutes,'number','min="1" required')}${F('max_minutes','最长间隔（分钟）',c.max_minutes,'number','min="1" required')}${F('warm_days','初期额度天数（0 关闭）',c.warm_days,'number','min="0" required')}${F('warm_cap','初期每日额度',c.warm_cap,'number','min="1" required')}</div>${F('zone','时区',c.zone,'text','required')}${F('start_date','开始日期（可留空）',c.start_date,'date')}<label>间隔方式</label><select name="interval_mode"><option value="random" ${c.interval_mode==='random'?'selected':''}>范围内随机</option><option value="fixed" ${c.interval_mode==='fixed'?'selected':''}>固定间隔</option></select><label>活动日</label><div class="actions">${['一','二','三','四','五','六','日'].map((v,i)=>`<label class="check"><input type="checkbox" name="days" value="${i}" ${c.weekdays.split(',').includes(String(i))?'checked':''}>周${v}</label>`).join('')}</div><label class="check"><input name="enabled" type="checkbox" ${c.enabled?'checked':''}>允许此邮箱发送</label><label class="check"><input name="jitter" type="checkbox" ${c.jitter?'checked':''}>额外添加 30–60 秒随机浮动</label><div class="hint">手动回复计入额度，沿用原脚本行为，不受自动时段与间隔约束。</div>`,async f=>{const config=Object.fromEntries(f);config.weekdays=f.getAll('days').join(',');delete config.days;config.enabled=f.has('enabled');config.jitter=f.has('jitter');if(config.interval_mode==='fixed')config.max_minutes=config.min_minutes;await call('schedule',{config});toast('日程已保存');await refresh();});}
function download(name,data){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function attachmentFiles(f){const files=f.getAll('attachments').filter(x=>x.size);if(files.length>5||files.reduce((n,f)=>n+f.size,0)>5000000)throw Error('附件最多 5 个、合计 5 MB。');return Promise.all(files.map(file=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:file.name,base64:r.result.split(',')[1]});r.onerror=reject;r.readAsDataURL(file);})))}
async function act(a,el){const id=el?.dataset.id;if(a==='close')return $('#modal').close();if(a==='boot')return boot();if(a==='enroll'){await call('enroll');chosen=S.me;return boot();}if(a==='refresh')return refresh();if(a==='nav'){page=el.dataset.page;shell();return render();}if(a==='switch'){chosen=el.dataset.email;return refresh();}if(a==='schedule')return schedule();if(a==='search'){search=$('#search').value;return render();}if(a==='invite')return modal('邀请发件邮箱',F('email','Gmail 邮箱','','email','required')+'<div class="hint">只登记授权资格，不会向此邮箱发送邀请邮件。请让该邮箱打开同一网页，以自己的 Google 账号授权并连接。连接时会将业务数据表共享给管理员。</div>',async f=>{await call('invite',{email:f.get('email')});toast('邮箱已登记，可打开同一网页连接');await refresh();});if(a==='import')return modal('导入客户',F('batch','批次名称',batch,'text','required')+'<label>选择 CSV 文件</label><input type="file" name="file" accept=".csv" required><div class="hint">表头：email,first_name,location,subject,body。重复邮箱跳过，每次最多 2000 位。导入不会启动发送。</div>',async f=>{const result=await call('import',{batch:f.get('batch'),csv:await f.get('file').text()});toast(`新增 ${result.added} 位，跳过 ${result.duplicates} 位。${result.errors.slice(0,3).join('；')}`);await refresh();},'导入');if(a==='apply'){if(!batch)throw Error('请先选择客户批次。');if(!confirm('将当前模板应用到此批次尚未发送的客户？'))return;await call('applyTemplate',{batch});await refresh();return toast('模板已应用');}if(a==='editContact'){const c=D.contacts.find(c=>c.id===id);return modal(E(c.email),F('subject','主题',c.subject)+A('body','正文',c.body)+`<label>发送控制</label><select name="control">${['active','paused','blocked'].map(s=>`<option value="${s}" ${s===c.control?'selected':''}>${labels[s]}</option>`).join('')}</select><div class="hint">已发送的主题与正文不改写历史，只更新发送控制。</div>`,async f=>{await call('contact',{id,...Object.fromEntries(f)});await refresh();});}if(a==='newtask'){const bs=[...new Set(D.contacts.map(c=>c.batch))];if(!bs.length)throw Error('请先导入客户批次。');return modal('创建发送任务',F('name','任务名称','','text','required')+'<label>客户批次</label><select name="batch">'+bs.map(b=>`<option>${E(b)}</option>`).join('')+'</select><div class="hint">新任务默认暂停，需在任务页面明确启动。发件邮箱：'+E(chosen)+'</div>',async f=>{await call('task',Object.fromEntries(f));page='tasks';await refresh();},'创建暂停任务');}if(a==='taskstate'){const state=el.dataset.state;if(state==='running'&&!confirm('确认启动？后台将按此邮箱日程自动发信。'))return;if(state==='cancelled'&&!confirm('取消后不能恢复此任务，确定？'))return;await call('taskState',{id,state});return refresh();}if(a==='trigger'){if(chosen!==S.me)throw Error('请用所选 Gmail 账号打开网页并安装其触发器。');await call('installTrigger');await refresh();return toast('后台定时任务已安装；只执行明确启动的任务。');}if(a==='stopTrigger'){await call('stopTrigger');await refresh();return toast('当前账号后台已停止。');}if(a==='sync'){const r=await call('sync');await refresh();return toast(`已同步 ${r.count} 条会话消息。`);}if(a==='reconcile'){const r=await call('reconcile');await refresh();return toast(`已确认 ${r.resolved} 条，仍有 ${r.remaining} 条待核对。`);}if(a==='resume'){await call('resume');await refresh();return toast('本地暂停已解除；Google 服务限制仍以官方状态为准。');}if(a==='backup')return download('MailStudio_'+chosen+'.json',await call('backup'));if(a==='restore')return modal('恢复空工作区','<label>本免费网页版 JSON 备份</label><input type="file" name="file" accept=".json" required><div class="hint">只允许恢复到没有客户或发送记录的工作区。恢复后任务暂停、自动发送关闭。</div>',async f=>{await call('restore',{backup:JSON.parse(await f.get('file').text())});toast('备份已恢复，发送已关闭');await refresh();},'恢复');if(a==='conversation'){currentContact=id;const c=D.contacts.find(c=>c.id===id),ms=D.messages.filter(m=>m.contact_id===id).sort((a,b)=>a.date-b.date),draft=D.drafts.find(d=>d.id===id);const key=crypto.randomUUID();return modal(E(c.email),`<div>${ms.map(m=>`<div class="message ${m.incoming?'':'out'}"><small>${E(m.from)} · ${fmt(m.date)} ${m.auto?'· 自动回复':''}</small><div>${E(m.body)}</div></div>`).join('')||'<p>还没有缓存消息，请先同步此邮箱。</p>'}</div>${A('body','回复正文',draft?.body||'')}<label>附件（最多 5 个，共 5 MB）</label><input name="attachments" type="file" multiple>${B('saveDraft','保存草稿')}<div class="hint">使用原发件 Gmail 与原线程发送。操作失败或结果不确定时不会自动重试。</div>`,async f=>{if(!confirm('确认发送这封回复给 '+c.email+'？'))return;const r=await call('reply',{id,key,body:f.get('body'),attachments:await attachmentFiles(f)});toast(r.state==='sent'?'回复已发送':'发送结果待确认，已暂停继续发送');await refresh();},'发送回复');}if(a==='saveDraft'){await call('draft',{id:currentContact,body:$('#form textarea[name=body]').value});toast('草稿已保存');}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;b.disabled=true;try{await act(b.dataset.act,b);}catch(e){toast(e.message);}finally{b.disabled=false;}});boot();
</script></body></html>
